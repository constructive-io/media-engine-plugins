[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "media-engine-ltx"
dynamic = ["version"]
description = "Video from words or from a still for Constructive Media, through LTX-Video."
readme = "README.md"
requires-python = ">=3.11"
# This is the license of the adapter's code. The model it runs is fetched from
# Lightricks under terms of their own, which are not MIT: see the README.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Lynch", email = "pyramation@gmail.com" }]
keywords = ["constructive", "media", "video", "generation", "image-to-video", "ltx-video"]
dependencies = [
  "constructive-media",
  "torch",
  "diffusers>=0.33",
  "transformers",
  "sentencepiece",
  "protobuf",
  "pillow",
  "numpy",
]

[project.entry-points."constructive_media.adapters"]
ltx = "media_engine_ltx:adapters"

[project.urls]
Homepage = "https://github.com/constructive-io/media-engine-plugins"

[tool.setuptools]
packages = ["media_engine_ltx"]

[tool.setuptools.dynamic]
version = { attr = "media_engine_ltx.__version__" }
